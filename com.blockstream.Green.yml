app-id: com.blockstream.Green
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: blockstream
rename-desktop-file: blockstream.desktop
rename-icon: linux_production

finish-args:
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --device=all

modules:
  - name: xcb-util-cursor
    buildsystem: autotools
    sources:
      - type: archive
        url: https://xcb.freedesktop.org/dist/xcb-util-cursor-0.1.5.tar.gz
        sha256: 0e9c5446dc6f3beb8af6ebfcc9e27bcc6da6fe2860f7fc07b99144dfa568e93b

  - name: blockstream
    buildsystem: simple
    build-commands:
      - chmod +x Blockstream-x86_64.AppImage
      - ./Blockstream-x86_64.AppImage --appimage-extract
      - cp -a squashfs-root/usr/* ${FLATPAK_DEST}/
      - install -Dm644 com.blockstream.Green.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/

    sources:
      - type: file
        url: https://github.com/Blockstream/green_qt/releases/download/release_3.4.1/Blockstream-x86_64.AppImage
        sha256: f27ddf2f1c25f87479204200bfb64f1097d4703e1587b5a1ad5f0eea089d6a99
        dest-filename: Blockstream-x86_64.AppImage
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Blockstream/green_qt/releases/latest
          url-query: .assets[] | select(.name=="Blockstream-x86_64.AppImage") | .browser_download_url
          version-query: .tag_name | sub("^release_"; "")

      - type: file
        path: com.blockstream.Green.metainfo.xml

      - type: file
        url: https://raw.githubusercontent.com/Blockstream/green_qt/fe091a9728ee5692c70fecdddcf9d9ac5b955608/LICENSE
        sha256: c61f12da7cdad526bdcbed47a4c0a603e60dbbfdaf8b66933cd088e9132c303f
