app-id: com.blockstream.Green
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: blockstream
rename-desktop-file: blockstream.desktop
rename-icon: linux_production

finish-args:
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --device=all

modules:
  - name: green
    buildsystem: simple
    build-commands:
      - chmod +x Blockstream-x86_64.AppImage
      - ./Blockstream-x86_64.AppImage --appimage-extract
      - cp -a squashfs-root/usr/* ${FLATPAK_DEST}/
      - install -Dm644 com.blockstream.Green.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.blockstream.Green.metainfo.xml

    sources:
      - type: file
        url: https://github.com/Blockstream/green_qt/releases/download/release_3.2.0/Blockstream-x86_64.AppImage
        sha256: 05373eb4e815ad3a8a7c7172ab1001e74025d97e6c953ae50db241cd151aef7a
        dest-filename: Blockstream-x86_64.AppImage
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Blockstream/green_qt/releases/latest
          url-query: .assets[] | select(.name=="Blockstream-x86_64.AppImage") | .browser_download_url
          version-query: .tag_name | sub("^release_"; "")

      - type: file
        path: com.blockstream.Green.metainfo.xml
